<!DOCTYPE html>
<html>
<head>
    <title>Akay's Visited Cities</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="container-fluid vh-100 d-flex flex-column p-0">
        <header class="bg-dark text-white p-3 position-relative">
            <button class="menu-toggle d-md-none" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>
            <h1 class="text-center mb-0">Akay's Travel Map</h1>
        </header>
        <div class="row flex-grow-1 flex-nowrap m-0">
            <div id="sidebar" class="bg-light p-3 d-flex flex-column h-100">
                <h4 class="mb-3">Visited Cities</h4>
                <ul id="city-list" class="list-group flex-grow-1 overflow-auto"></ul>
            </div>
            <div id="map" class="flex-grow-1 p-0 h-100"></div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        // Safety net: iOS Safari can auto-scroll the body internally (e.g. to
        // bring a tapped button "into view"), which visually drags the fixed
        // header out of place. Body isn't meant to scroll at all on mobile,
        // so snap it back to 0 whenever that happens.
        function snapBodyScroll() {
            if (window.innerWidth > 767.98) return;
            if (document.body.scrollTop !== 0) document.body.scrollTop = 0;
            if (document.documentElement.scrollTop !== 0) document.documentElement.scrollTop = 0;
        }
        document.addEventListener('scroll', snapBodyScroll, true);

        // Toggle mobile menu
        document.getElementById('menuToggle').addEventListener('click', function(e) {
            e.stopPropagation();
            document.getElementById('sidebar').classList.toggle('show');
        });
        
        // Close menu when clicking outside on mobile
        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById('sidebar');
            const menuToggle = document.getElementById('menuToggle');
            const map = document.getElementById('map');
            
            if (window.innerWidth <= 767.98 && 
                !sidebar.contains(event.target) && 
                !menuToggle.contains(event.target) &&
                event.target !== map &&
                !map.contains(event.target) &&
                sidebar.classList.contains('show')) {
                sidebar.classList.remove('show');
            }
        });

        // Temporary diagnostic overlay: append ?debug=1 to the URL to show it.
        if (new URLSearchParams(location.search).has('debug')) {
            const box = document.createElement('div');
            box.style.cssText = 'position:fixed;left:0;bottom:0;z-index:999999;background:rgba(0,0,0,0.85);color:#0f0;font:10px/1.4 monospace;padding:6px 8px;max-width:100vw;white-space:pre;pointer-events:none;';
            document.body.appendChild(box);
            function update() {
                const h = document.querySelector('header').getBoundingClientRect();
                const t = document.querySelector('.top10-control');
                const tr = t ? t.getBoundingClientRect() : null;
                const vv = window.visualViewport;
                box.textContent =
                    `win: ${window.innerWidth}x${window.innerHeight}  scroll: ${window.scrollX},${window.scrollY}\n` +
                    `docEl.scrollTop: ${document.documentElement.scrollTop}  body.scrollTop: ${document.body.scrollTop}\n` +
                    (vv ? `visualViewport: ${vv.width.toFixed(0)}x${vv.height.toFixed(0)} offset:${vv.offsetLeft.toFixed(0)},${vv.offsetTop.toFixed(0)} scale:${vv.scale.toFixed(2)}\n` : 'visualViewport: n/a\n') +
                    `header top/bottom: ${h.top.toFixed(0)}/${h.bottom.toFixed(0)}\n` +
                    (tr ? `top10 top/bottom: ${tr.top.toFixed(0)}/${tr.bottom.toFixed(0)}\n` : 'top10: n/a\n') +
                    `sidebar.show: ${document.getElementById('sidebar').classList.contains('show')}`;
            }
            update();
            window.addEventListener('scroll', update, true);
            window.addEventListener('resize', update);
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', update);
                window.visualViewport.addEventListener('scroll', update);
            }
            document.getElementById('menuToggle').addEventListener('click', () => setTimeout(update, 350));
            document.addEventListener('click', () => setTimeout(update, 350));
            setInterval(update, 500);
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
